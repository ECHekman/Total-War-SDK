name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rpfm-interface

      - name: Build rpfm-interface
        working-directory: rpfm-interface
        run: npm run build

      - name: Install
        working-directory: extension
        run: npm ci

      - name: Lint and type check
        working-directory: extension
        run: |
          npm run lint
          npm run typecheck

      - name: Build Lua 5.1 for the debuggee tests
        working-directory: extension
        run: npm run build-lua

      - name: Unit and debuggee tests
        working-directory: extension
        run: npm test

      - name: Extension tests (VS Code)
        working-directory: extension
        run: npm run test:vscode

      - name: Check the tag matches the extension version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: extension
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Package
        working-directory: extension
        run: npx vsce package --target win32-x64 --out total-war-modding-tools-win32-x64.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: total-war-modding-tools
          path: extension/*.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Job level so the steps' `if` can see them; a step's own env is not
    # available to its condition.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: total-war-modding-tools

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'

      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@4 publish --packagePath *.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish --packagePath *.vsix -p "$OVSX_PAT"
