name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rpfm-interface

      - name: Build rpfm-interface
        working-directory: rpfm-interface
        run: npm run build

      - name: Install
        working-directory: extension
        run: npm ci

      - name: Lint and type check
        working-directory: extension
        run: |
          npm run lint
          npm run typecheck

      - name: Build Lua 5.1 for the debuggee tests
        working-directory: extension
        run: npm run build-lua

      - name: Unit and debuggee tests
        working-directory: extension
        run: npm test

      - name: Extension tests (VS Code)
        working-directory: extension
        run: npm run test:vscode

      - name: Package
        working-directory: extension
        run: npx vsce package --target win32-x64 --out tw-lua-debug-win32-x64.vsix

      - name: Build the debugger mod pack
        working-directory: extension
        run: node -e "require('./native/rpfm-interface.node').createPackFromFolder('../debuggee', 'tw_lua_debugger.pack', 'warhammer_3')"

      - uses: actions/upload-artifact@v4
        with:
          name: tw-lua-debug
          path: |
            extension/*.vsix
            extension/tw_lua_debugger.pack

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tw-lua-debug

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.vsix
            *.pack

      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath *.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish *.vsix -p "$OVSX_PAT"
