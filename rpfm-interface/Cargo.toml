[package]
name = "rpfm-interface"
version = "2.0.0"
authors = ["Fietspompje"]
edition = "2021"
license = "MIT"
description = "Node.js bindings to rpfm_lib for the TW Lua Debugger VS Code extension"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
rpfm_lib = "4.7"
# Already a dependency of rpfm_lib.
regex = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
# Smaller binary (it ships in the VSIX); reading packs is not speed critical.
opt-level = "s"
codegen-units = 1
